[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telcodec"
version = "0.1.0"
description = "Encoders and decoders for telecom identifier and text formats: TBCD, GSM 7-bit, PLMN, IMSI, MSISDN."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
